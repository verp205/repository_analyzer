spring.application.name=repository_analyzer

# Backend принимает подключения только с этой машины.
# Для доступа по сети задайте SERVER_ADDRESS=0.0.0.0 и обязательно API_TOKEN.
server.address=${SERVER_ADDRESS:127.0.0.1}

spring.datasource.url=jdbc:sqlite:file:./data/repository-analyzer.db?foreign_keys=on&journal_mode=WAL&busy_timeout=10000
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000

spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false

spring.sql.init.mode=never

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when_authorized

repository-analyzer.analysis.max-threads=10
repository-analyzer.analysis.queue-capacity=100
repository-analyzer.directory.path=./data/repositories
repository-analyzer.analysis.max-attempts=3

repository-analyzer.report.max-in-flight=2
repository-analyzer.report.synthesis-batch-chars=10000
repository-analyzer.report.synthesis-max-passes=4
repository-analyzer.report.commit-batch-size=5
repository-analyzer.report.small-commit-max-lines=40
# Additional model review stays opt-in until the configured model passes quality evaluation.
repository-analyzer.report.grounded-review-enabled=${REPORT_GROUNDED_REVIEW_ENABLED:false}

repository-analyzer.llm.provider=openai-compatible
repository-analyzer.llm.provider-id=ollama
repository-analyzer.llm.base-url=http://127.0.0.1:11434
repository-analyzer.llm.chat-path=/v1/chat/completions
repository-analyzer.llm.model=qwen3:8b
repository-analyzer.llm.api-key=
repository-analyzer.llm.max-concurrent-requests=2
repository-analyzer.llm.commit-max-tokens=700
repository-analyzer.llm.commit-reasoning-effort=none
repository-analyzer.llm.synthesis-batch-max-tokens=600
repository-analyzer.llm.synthesis-batch-reasoning-effort=none
repository-analyzer.llm.synthesis-final-max-tokens=4096
repository-analyzer.llm.synthesis-final-reasoning-effort=low
repository-analyzer.llm.commit-batch-max-tokens=2400
repository-analyzer.llm.json-mode=true
repository-analyzer.llm.max-attempts=3
repository-analyzer.llm.retry-backoff-millis=2000
repository-analyzer.llm.connect-timeout-millis=10000
repository-analyzer.llm.commit-timeout-millis=180000
repository-analyzer.llm.synthesis-timeout-millis=600000

repository-analyzer.context.max-files=15
repository-analyzer.context.max-patch-characters-per-file=1600
repository-analyzer.context.max-patch-characters-total=10000
repository-analyzer.context.max-imports-per-file=30
repository-analyzer.context.max-parsing-problems-per-file=5
repository-analyzer.context.max-types-per-file=5
repository-analyzer.context.max-methods-per-type=10

# Контекст pull/merge request'ов. Без токена GitHub даёт ~60 запросов в час.
repository-analyzer.forge.enabled=true
repository-analyzer.forge.github-token=${GITHUB_TOKEN:}
repository-analyzer.forge.gitlab-token=${GITLAB_TOKEN:}
repository-analyzer.forge.gitlab-hosts=${GITLAB_HOSTS:}

# Защита API и ограничение клонируемых адресов.
repository-analyzer.security.api-token=${API_TOKEN:}
repository-analyzer.security.allow-private-hosts=${ALLOW_PRIVATE_GIT_HOSTS:false}
repository-analyzer.security.allowed-hosts=${ALLOWED_GIT_HOSTS:}
