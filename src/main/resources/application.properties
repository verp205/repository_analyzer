spring.application.name=repository_analyzer

spring.datasource.url=jdbc:sqlite:file:./data/repository-analyzer.db?foreign_keys=on&journal_mode=WAL&busy_timeout=10000
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000

spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false

spring.sql.init.mode=never

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when_authorized

repository-analyzer.analysis.max-threads=10
repository-analyzer.analysis.queue-capacity=100
repository-analyzer.directory.path=./data/repositories
